<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <title>Sentiment Analysis</title>
</head>
<body>
    <h1>Sentiment Analysis with Logistic Regression & LSTM</h1>

    <form method="POST">
        <textarea name="comment" rows="6" cols="60" placeholder="Enter your comment here..." required>{{ comment if comment else '' }}</textarea><br><br>
        <button type="submit">Predict Sentiment</button>
    </form>

    {% if lr_result and lstm_result %}
        <h2>Predictions:</h2>
        <p><strong>Logistic Regression Prediction:</strong> {{ lr_result }}</p>
        <p><strong>LSTM Prediction:</strong> {{ lstm_result }}</p>
    {% endif %}
</body>
</html>
